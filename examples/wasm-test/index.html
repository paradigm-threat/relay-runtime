<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>relay-runtime WASM test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style id="themed-styler-output"></style>
  <style>
    :root {
      --header-accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1.5rem;
      line-height: 1.6;
    }
    .page-header {
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    body:has([data-theme]) .page-header,
    .dark .page-header { border-bottom-color: rgba(255, 255, 255, 0.1); }
    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: inherit;
    }
    .page-header p {
      margin: 0;
      opacity: 0.85;
      font-size: 0.95rem;
    }
    #root { min-height: 2rem; }
    #root:empty::after {
      content: 'Loading WASM…';
      opacity: 0.7;
      font-size: 0.9rem;
    }
    .error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #dc2626;
      padding: 1rem 1.25rem;
      border-radius: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>relay-runtime WASM test</h1>
    <p>All hook tests rendered via relay-runtime (WASM). Styles loaded from theme.yaml at runtime.</p>
  </header>
  <div id="root">Loading WASM…</div>

  <script type="module">
    import { bootstrap } from './pkg/relay-runtime-web.js';
    const params = new URLSearchParams(location.search);
    bootstrap(params.has('minimal') ? { appPath: 'hooks/minimal-app.jsx' } : {});
  </script>
</body>
</html>
