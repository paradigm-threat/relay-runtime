[package]
name = "relay-runtime"
version = "0.1.1"
edition = "2021"
description = "Universal client hook runtime: parsing, execution, rendering, debugging"
license = "MIT OR Apache-2.0"
authors = ["Ari Asulin"]
repository = "https://gitlab.com/clevertree/relay-runtime"
homepage = "https://gitlab.com/clevertree/relay-runtime"
readme = "README.md"
keywords = ["relay", "hooks", "cleverscript", "wasm"]
categories = ["wasm", "development-tools"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "relay-cli"
path = "src/bin/relay-cli.rs"

[features]
default = []
wasm = ["console_error_panic_hook"]
debug = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# themed-styler lives in relay-gateway (vendored snapshot for CI)
themed-styler = { version = "1.2.10", path = "../relay/relay-gateway/themed-styler" }
md2ast = { version = "1.0.2", path = "../md2ast" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
js-sys = "0.3"
themed-styler = { version = "1.2.10", path = "../relay/relay-gateway/themed-styler", features = ["wasm"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
themed-styler = { version = "1.2.10", path = "../relay/relay-gateway/themed-styler", features = ["android"] }

[dev-dependencies]
