[package]
name = "relay-runtime"
version = "0.1.0"
edition = "2021"
description = "Universal client hook runtime: parsing, execution, rendering, debugging"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "relay-cli"
path = "src/bin/relay-cli.rs"

[features]
default = []
wasm = ["console_error_panic_hook"]
debug = []

[dependencies]
# Parsing
# nom = "7"
# pest = "2"
# Or hand-rolled for minimal deps

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_yaml = "0.9"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
js-sys = "0.3"
# Theme styling (built into relay-runtime - no separate build step)
themed-styler = { path = "../themed-styler", features = ["wasm"] }

[dev-dependencies]
# For tests
